name: Build Windows Package

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-package:
    name: Test and build Windows package
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Set package version
        shell: pwsh
        run: |
          $tag = git describe --tags --abbrev=0 2>$null
          if (-not $tag) {
            $tag = "v0.0"
            $count = git rev-list --count HEAD
          } else {
            $count = git rev-list --count "$tag..HEAD"
          }
          $version = "$tag.$count" -replace '[^0-9A-Za-z._-]', '-'
          $appName = "d64tr-factory-tool-$version"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_NAME=$appName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build executable
        run: >-
          pyinstaller --clean --onefile --windowed --name "$env:APP_NAME"
          --icon d64tr_factory_tool/assets/d64tr-icon.ico
          --add-data "d64tr_factory_tool/assets/d64tr-icon.png:d64tr_factory_tool/assets"
          main.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-windows
          path: dist/${{ env.APP_NAME }}.exe
          if-no-files-found: error
